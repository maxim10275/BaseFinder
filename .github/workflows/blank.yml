name: Сборка BaseFinder

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Распаковка исходников
        run: unzip -q BaseFinder48-source-G.zip -d source

      - name: Сборка мода
        run: |
          cd source/BaseFinder48-source
          chmod +x gradlew
          ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: BaseFinder-JAR
          path: source/BaseFinder48-source/build/libs/*.jar
