name: Сборка BaseFinder

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Сборка мода
        run: chmod +x ./gradlew && ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: BaseFinder-JAR
          path: build/libs/*.jar
          
